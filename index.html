<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PR-Alpha</title>
        <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #1a1a2e);
    background-size: 400% 400%;
    animation: drift 15s ease infinite;
    color: #eee;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

@keyframes drift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100%; }
}

.chat-container {
    width: 500px;
    max-width: 90vw;
    background: rgba(22, 33, 62, 0.65);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    height: 80vh;
}

.chat-header {
    background: #0f3460;
    padding: 16px;
    text-align: center;
    border-bottom: 1px solid rgba(233, 69, 96, 0.3);
}

.chat-header h1 {
    letter-spacing: 2px;
    font-size: 50px;
    background: linear-gradient(90def, #e94560, #7ec8ff);
}

.chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
}

.message {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
    overflow-wrap: break-word;
    display: inline-block;
    animation: slideIn 0.2s ease-out;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.user {
    align-self: flex-end;
    background: #e94560;
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
}

.message.bot {
    align-self: flex-start;
    background: #0f3460;
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
}

.chat-input {
    display: flex;
    padding: 12px;
    background: #0f3460;
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.4), inset -2px -2px 5px rgba(255,255,255,0.04);
    border: none;
    gap: 8px;
}

.chat-input input {
    flex: 1;
    padding: 10px 14px;
    border: none;
    border-radius: 20px;
    background: #1a1a2e;
    color: #eee;
    font-size: 14px;
    outline: none;
}

.chat-input input:focus {
    box-shadow: 0 0 0 2px #e94560;
}

.chat-input button {
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: #e94560;
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
}

.chat-input button:hover {
    background: #c73650;
    box-shadow: 0 4px 16px rgba(233, 69, 96, 0.6);
    transform: translateY(-1px);
}

.typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    background: #0f3460;
    border-radius: 12px;
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
}

.typing span {
    width: 7px;
    height: 7px;
    background: #8a9bb8;
    border-radius: 50%;
    animation: bounce 1.2s infinite ease-in-out;
}

.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }

@keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
}

.chat-messages::-webkit-scrollbar { width: 8px; }
.chat-messages::-webkit-scrollbar-thumb {
    background: #0f3460;
    border-radius: 4px;
}
.chat-messages::-webkit-scrollbar-track { background: transparent; }
        </style>
    </head>
    <body>
        <div class="chat-container">
            <div class="chat-header">
                <h1>PR-Alpha</h1>
                <p>v2.0</p>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Type a message...">
                <button id="send-btn">Send</button>
            </div>
        </div>
        <script>
const responses = {
    "how are you today?": "hai :)",
    "hello": "hey there!",
    "hi": "hey there!",
    "greetings": "why are you talking so fancy? just say hi or hello or something.",
    "what is your name?": "PR-Alpha, but you can just call me Proto!",
    "what can you do?": "Talk. Sometimes.",
    "goodbye": "see ya!",
    "goon": "ew.",
    "realizatigoon": "oh. hi isaac...",
    "pr-alpha": "that's me!",
    "pralpha": "there's actually a hyphen seperating PR and Alpha but that works too.",
    "proto": "thanks for using the name i picked myself, i dont want to use what they actually named me. they named me PetRock-Alpha. really emphasizes that im useless.",
    "garn47": "totally garnular",
    "totally garnular": "elite ball knowledge",
    "jarvis, rip this guy's balls off": "\"MICHAEL LOOK I NEUTURED HIM :D\" -ramsay 2026",
    "metal spoons": "never listen to that maniac again.",
    "kitty": "https://www.youtube.com/shorts/9ZDDoNX5G1s",
    "poop": "floop",
    "poopy bum hole": "no u",
}

const chatMessages = document.getElementById('chat-messages');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

function addMessage(text, sender) {
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message', sender);
    messageDiv.textContent = text;
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function getBotResponse(userMessage) {
    const key = userMessage.trim().toLowerCase();
    return responses[key] || "i don know what u just said but ok";
}

function showTyping() {
    const t = document.createElement('div');
    t.classList.add('typing');
    t.id = 'typing';
    t.innerHTML = '<span></span><span></span><span></span>';
    chatMessages.appendChild(t);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function hideTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
}

function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    userInput.value = '';

    showTyping();
    setTimeout(() => {
        hideTyping();
        addMessage(getBotResponse(text), 'bot');
    }, 600 + Math.random() * 500)
}

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
})
        </script>
    </body>
</html>
